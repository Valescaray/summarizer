name: Summarizer CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write # Required for OIDC federation to AWS
  contents: read # Allows checkout and basic repo read access

env:
  AWS_REGION: us-west-2
  BACKEND_REPO_NAME: summarizer-backend
  FRONTEND_REPO_NAME: summarizer-frontend
  BACKEND_PATH: ./Backend1
  FRONTEND_PATH: ./Summarizer_app1
  TERRAFORM_PATH: infra/terraform
  ANSIBLE_PATH: infra/ansible

jobs:
  # ==========================================================
  # 1️⃣ CI — Build & Push Docker Images to ECR
  # ==========================================================
  build_and_push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest

    outputs:
      backend_repo_url: ${{ steps.backend.outputs.backend_repo_url }}
      frontend_repo_url: ${{ steps.frontend.outputs.frontend_repo_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          # aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          # aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Ensure ECR repositories exist
        run: |
          aws ecr describe-repositories --repository-names $BACKEND_REPO_NAME >/dev/null 2>&1 || \
          aws ecr create-repository --repository-name $BACKEND_REPO_NAME --region $AWS_REGION

          aws ecr describe-repositories --repository-names $FRONTEND_REPO_NAME >/dev/null 2>&1 || \
          aws ecr create-repository --repository-name $FRONTEND_REPO_NAME --region $AWS_REGION

      - name: Login to Amazon ECR
        id: ecr
        run: |
          echo "Logging into ECR..."
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $(aws sts get-caller-identity --query 'Account' --output text).dkr.ecr.$AWS_REGION.amazonaws.com
          echo "ECR login succeeded."

      - name: Build and push backend image
        id: backend
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query 'Account' --output text)
          BACKEND_REPO_URL="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$BACKEND_REPO_NAME"
          docker build -t $BACKEND_REPO_URL:latest -f ./Backend1/Dockerfile ./Backend1
          docker push $BACKEND_REPO_URL:latest
          echo "backend_repo_url=$BACKEND_REPO_URL" >> $GITHUB_OUTPUT

      - name: Build and push frontend image
        id: frontend
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query 'Account' --output text)
          FRONTEND_REPO_URL="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$FRONTEND_REPO_NAME"
          docker build -t $FRONTEND_REPO_URL:latest -f ./Summarizer_app1/Dockerfile ./Summarizer_app1
          docker push $FRONTEND_REPO_URL:latest
          echo "frontend_repo_url=$FRONTEND_REPO_URL" >> $GITHUB_OUTPUT

      - name: Write SSH public key to file
        run: |
          mkdir -p infra/terraform
          echo "${{ secrets.EC2_SSH_PUBLIC_KEY }}" > infra/terraform/summarizer-key.pub
          echo "✅ SSH public key written to infra/terraform/summarizer-key.pub"
          ls -l infra/terraform/

      - name: Upload SSH public key as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ssh-key
          path: infra/terraform/summarizer-key.pub

  # ==========================================================
  # 2️⃣ INFRA — Terraform Apply (EC2, Security Group, etc)
  # ==========================================================
  terraform_apply:
    name: Provision Infrastructure with Terraform
    runs-on: ubuntu-latest
    needs: build_and_push

    defaults:
      run:
        working-directory: infra/terraform

    outputs:
      backend_ip: ${{ steps.output.outputs.backend_ip }}
      frontend_ip: ${{ steps.output.outputs.frontend_ip }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download SSH public key
        uses: actions/download-artifact@v4
        with:
          name: ssh-key
          path: infra/terraform

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region:
            ${{ env.AWS_REGION }}
            # aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            # aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            # aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Verify key file
        run: |
          ls -l 
          cat summarizer-key.pub | head -c 50

      - name: Initialize Terraform
        run: terraform init

      - name: Plan Terraform changes
        run: terraform plan -out=tfplan

      - name: Apply Terraform (auto-approve)
        run: terraform apply -auto-approve tfplan

      - name: Export EC2 IPs
        id: output
        run: |
          echo "backend_ip=$(terraform output -raw backend_public_ip)" >> $GITHUB_OUTPUT
          echo "frontend_ip=$(terraform output -raw frontend_public_ip)" >> $GITHUB_OUTPUT

  # ==========================================================
  # 3️⃣ CD — Deploy Using Ansible
  # ==========================================================
  ansible_deploy:
    name: Deploy to EC2 with Ansible
    runs-on: ubuntu-latest
    needs: [build_and_push, terraform_apply]

    env:
      ANSIBLE_HOST_KEY_CHECKING: "False"
      BACKEND_IP: ${{ needs.terraform_apply.outputs.backend_ip }}
      FRONTEND_IP: ${{ needs.terraform_apply.outputs.frontend_ip }}
      AWS_REGION: us-west-2
      BACKEND_REPO_NAME: summarizer-backend
      FRONTEND_REPO_NAME: summarizer-frontend
      BACKEND_PATH: ./Backend1
      FRONTEND_PATH: ./Summarizer_app1
      TERRAFORM_PATH: ./infra/terraform
      ANSIBLE_PATH: ./infra/ansible
      BACKEND_REPO_URL: ${{ needs.build_and_push.outputs.backend_repo_url }}
      FRONTEND_REPO_URL: ${{ needs.build_and_push.outputs.frontend_repo_url }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ansible + AWS collection
        run: |
          python -m pip install --upgrade pip
          pip install boto3 botocore
          ansible-galaxy collection install amazon.aws

      - name: Ensure Ansible directory exists
        run: |
          mkdir -p ${{ env.ANSIBLE_PATH }}

      - name: Write dynamic inventory file
        run: |
          echo "[backend]" > ${{ env.ANSIBLE_PATH }}/inventory.ini
          echo "${{ env.BACKEND_IP }} ansible_user=ubuntu ansible_ssh_private_key_file=/home/runner/.ssh/id_rsa" >> ${{ env.ANSIBLE_PATH }}/inventory.ini
          echo "[frontend]" >> ${{ env.ANSIBLE_PATH }}/inventory.ini
          echo "${{ env.FRONTEND_IP }} ansible_user=ubuntu ansible_ssh_private_key_file=/home/runner/.ssh/id_rsa" >> ${{ env.ANSIBLE_PATH }}/inventory.ini

      - name: Configure SSH Key for EC2
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Add EC2 Hosts to known_hosts
        run: |
          ssh-keyscan -H $BACKEND_IP >> ~/.ssh/known_hosts
          ssh-keyscan -H $FRONTEND_IP >> ~/.ssh/known_hosts

      - name: Show repo URLs
        run: |
          echo "Backend: ${{ needs.build_and_push.outputs.backend_repo_url }}"
          echo "Frontend: ${{ needs.build_and_push.outputs.frontend_repo_url }}"

      - name: Run Ansible playbook
        run: |
          ansible-playbook -i ${{ env.ANSIBLE_PATH }}/inventory.ini ${{ env.ANSIBLE_PATH }}/deploy.yml \
            -e "aws_region=${{ env.AWS_REGION }} \
                backend_repo_url=${{ env.BACKEND_REPO_URL }} \
                frontend_repo_url=${{ env.FRONTEND_REPO_URL }}"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
