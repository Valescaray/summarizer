---
- name: Deploy Summarizer Backend and Frontend from ECR
  hosts: all
  become: true

  # hosts: localhost
  # connection: local
  # gather_facts: false

  vars:
    aws_region: "us-east-1" # ← Change this to your AWS region
    backend_repo_url: "{{ backend_repo_url | default('') }}"
    frontend_repo_url: "{{ frontend_repo_url | default('') }}"
    backend_container: "summarizer-backend"
    frontend_container: "summarizer-frontend"
    app_network: "summarizer_net"
    ansible_python_interpreter: /usr/bin/python3

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install dependencies (Docker, AWS CLI, Pip)
      apt:
        name:
          - docker.io
          - python3-pip
        state: present

    - name: Install and verify AWS CLI v2
      become: true
      shell: |
        set -e
        apt-get update -y && apt-get install -y unzip curl
        curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "/tmp/awscliv2.zip"
        unzip -o /tmp/awscliv2.zip -d /tmp
        /tmp/aws/install --update
        aws --version
      register: aws_cli_version
      changed_when: false

    - debug:
        msg: "✅ Installed AWS CLI version: {{ aws_cli_version.stdout }}"

    - name: Ensure Docker is started
      service:
        name: docker
        state: started
        enabled: true

    - name: Display repository URLs
      debug:
        msg:
          - "Backend Repo URL: {{ backend_repo_url | default('Not provided') }}"
          - "Frontend Repo URL: {{ frontend_repo_url | default('Not provided') }}"

    - name: Authenticate Docker with AWS ECR
      shell: |
        aws ecr get-login-password --region {{ aws_region }} | \
        docker login --username AWS --password-stdin {{ backend_repo_url | regex_replace('/.*','') }}
      environment:
        AWS_ACCESS_KEY_ID: "{{ lookup('env', 'AWS_ACCESS_KEY_ID') }}"
        AWS_SECRET_ACCESS_KEY: "{{ lookup('env', 'AWS_SECRET_ACCESS_KEY') }}"
        AWS_DEFAULT_REGION: "us-east-1"
      register: ecr_login
      changed_when: "'Login Succeeded' in ecr_login.stdout"

    - name: Create Docker network (if not exists)
      community.docker.docker_network:
        name: "{{ app_network }}"
        state: present

    - name: Ensure boto3 and botocore are installed
      become: yes
      ansible.builtin.pip:
        name:
          - boto3
          - botocore
        executable: pip3

    # - name: Fetch Google API key from Secrets Manager
    #   community.aws.secretsmanager_secret:
    #     name: summarizer_backend_env
    #     region: "{{ aws_region }}"
    #   register: backend_secret
    #   environment:
    #     AWS_ACCESS_KEY_ID: "{{ lookup('env', 'AWS_ACCESS_KEY_ID') }}"
    #     AWS_SECRET_ACCESS_KEY: "{{ lookup('env', 'AWS_SECRET_ACCESS_KEY') }}"
    #     AWS_DEFAULT_REGION: "{{ aws_region | default('us-east-1') }}"
    #   # when: not ansible_check_mode

    - name: Ensure /opt/summarizer directory exists
      file:
        path: /opt/summarizer
        state: directory
        mode: "0755"

    - name: Fetch Google API key from Secrets Manager
      set_fact:
        google_api_secret:
          GOOGLE_API_KEY: "{{ lookup('env', 'GOOGLE_API_KEY') }}"

    - name: Write backend env file
      copy:
        dest: /opt/summarizer/backend.env
        content: |
          GOOGLE_API_KEY={{ google_api_secret.GOOGLE_API_KEY }}
        mode: "0600"

    - name: Show file content
      command: cat /opt/summarizer/backend.env
      register: show_env
      changed_when: false

    - name: Generate frontend env file
      copy:
        dest: /opt/summarizer/frontend.env
        content: |
          VITE_APP_URL=http://{{ hostvars[groups['backend'][0]].ansible_host }}:8000
        mode: "0644"

    - name: Show file content
      command: cat /opt/summarizer/frontend.env
      register: show_env
      changed_when: false

    # -------------------------
    # BACKEND SETUP
    # -------------------------
    - name: Pull backend image from ECR
      shell: docker pull {{ backend_repo_url }}:latest
      register: backend_pull
      changed_when: "'Downloaded newer image' in backend_pull.stdout"

    - name: Stop existing backend container
      shell: docker rm -f {{ backend_container }}
      ignore_errors: yes

    - name: Run backend container
      community.docker.docker_container:
        name: "{{ backend_container }}"
        image: "{{ backend_repo_url }}:latest"
        env_file: /opt/summarizer/backend.env
        state: started
        restart_policy: always
        networks:
          - name: "{{ app_network }}"
        published_ports:
          - "8000:8000"

    # -------------------------
    # FRONTEND SETUP
    # -------------------------
    - name: Pull frontend image from ECR
      shell: docker pull {{ frontend_repo_url }}:latest
      register: frontend_pull
      changed_when: "'Downloaded newer image' in frontend_pull.stdout"

    - name: Stop existing frontend container
      shell: docker rm -f {{ frontend_container }}
      ignore_errors: yes

    - name: Run frontend container
      community.docker.docker_container:
        name: "{{ frontend_container }}"
        image: "{{ frontend_repo_url }}:latest"
        env_file: /opt/summarizer/frontend.env
        state: started
        restart_policy: always
        networks:
          - name: "{{ app_network }}"
        published_ports:
          - "80:80"

    - debug:
        msg: "✅ Backend and Frontend containers deployed successfully!"
